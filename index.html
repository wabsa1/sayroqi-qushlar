<style>
  :root {
    /* Zarg'aldoq (goldfinch) ranglari */
    --red: #c8352a; --red-d: #9e2a1f; --gold: #f0b429; --gold-d: #a86f00;
    --cream: #fbf5ea; --sand: #efe2cb; --ink: #1d2433; --muted: #5d5547;
    --sky: #cfe3f2; --sky2: #eaf3fa;
    --card: rgba(255, 255, 255, .78); --line: rgba(29, 36, 51, .08);
    --r: 26px; --gap: 12px;
    --sh: 0 1px 2px rgba(60, 40, 10, .06), 0 16px 34px -22px rgba(60, 40, 10, .45);
    --ease: cubic-bezier(.2, .7, .2, 1);
    --font: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--cream); }
  body {
    margin: 0; min-height: 100vh; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink);
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky2) 28%, var(--cream) 55%, #f6ead3 100%);
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .i { width: 24px; height: 24px; flex: none; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :where(a, button):focus-visible { outline: 3px solid var(--red-d); outline-offset: 3px; }

  /* Fon bezaklari: suzuvchi notalar va pat */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg span { position: absolute; color: var(--gold); opacity: .32; }
  .bg svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  .n1 { width: 70px; height: 70px; left: 6%; top: 120px; animation: fly 9s ease-in-out infinite alternate; }
  .n2 { width: 46px; height: 46px; right: 8%; top: 70px; color: var(--red) !important; opacity: .22 !important; animation: fly 11s ease-in-out infinite alternate-reverse; }
  .n3 { width: 54px; height: 54px; right: 5%; top: 52%; animation: fly 13s ease-in-out infinite alternate; }
  .n4 { width: 40px; height: 40px; left: 4%; bottom: 14%; color: var(--red) !important; opacity: .2 !important; animation: fly 10s ease-in-out infinite alternate; }
  .f1 { width: 220px; height: 220px; right: -60px; bottom: -40px; color: var(--sand) !important; opacity: .9 !important; transform: rotate(18deg); }
  @keyframes fly { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-22px) rotate(8deg); } }

  .tile { position: relative; background: var(--card); border: 1px solid rgba(255, 255, 255, .9); border-radius: var(--r);
           box-shadow: 0 0 0 1px var(--line), var(--sh); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .press { transition: transform .25s var(--ease), box-shadow .25s var(--ease); cursor: pointer; }
  @media (hover: hover) { .press:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(200, 53, 42, .25), 0 22px 40px -22px rgba(60, 40, 10, .55); } }
  .press:active { transform: scale(.985); transition-duration: .08s; }
  .go { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%;
         color: var(--ink); background: var(--cream); box-shadow: inset 0 0 0 1px var(--line);
         transition: background-color .25s var(--ease), color .25s var(--ease), transform .25s var(--ease); }
  .go .i { width: 17px; height: 17px; }
  @media (hover: hover) { .press:hover .go { background: var(--red); color: #fff; transform: translate(2px, -2px); } }
  .press:focus-visible .go { background: var(--red); color: #fff; }

  .wrap { max-width: 460px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 0; }
  .bento { display: grid; gap: var(--gap); }

  /* Profil kartasi */
  .id { overflow: hidden; isolation: isolate; padding: 18px 20px 22px; text-align: center; }
  .id::before { content: ""; position: absolute; z-index: -1; inset: 0 0 auto 0; height: 96px;
                 background: linear-gradient(120deg, #9fc4e2, #cfe3f2 60%, #f6e7c9); }
  .id-top { display: flex; justify-content: flex-end; }
  .lang { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .7); box-shadow: inset 0 0 0 1px var(--line); }
  .lang button { position: relative; min-width: 46px; height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent;
                  color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: .08em; cursor: pointer; transition: background-color .2s, color .2s; }
  .lang button::after { content: ""; position: absolute; inset: -5px -1px; }
  .lang button[aria-pressed="true"] { background: var(--red); color: #fff; }

  .name { margin: 16px 0 0; font-size: 34px; font-weight: 900; line-height: 1.05; letter-spacing: .2px; }
  .name span { color: var(--red); }
  .handle { margin: 6px 0 0; font-size: 16px; font-weight: 800; color: var(--gold-d); }
  .tag { margin: 12px 0 0; font-size: 15px; font-weight: 700; color: var(--muted); }
  .wing { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .wing i { display: block; height: 7px; border-radius: 4px; }

  .links { display: grid; gap: var(--gap); }
  .link { display: flex; align-items: center; gap: 14px; min-height: 78px; padding: 13px 14px 13px 13px; }
  .chip { display: grid; place-items: center; width: 52px; height: 52px; flex: none; border-radius: 16px; color: #fff; }
  .chip .i { width: 27px; height: 27px; }
  .chip.ig { background: radial-gradient(circle at 28% 108%, #FEDA75 0%, #FA7E1E 24%, #D62976 52%, #962FBF 76%, #4F5BD5 100%); }
  .chip.tg { background: linear-gradient(180deg, #3AB4EE 0%, #1E96D4 100%); }
  .link-txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .link-title { font-size: 18px; font-weight: 900; line-height: 1.2; }
  .link-sub { font-size: 14.5px; font-weight: 700; color: var(--muted); overflow-wrap: anywhere; }

  .contact { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
  .call { grid-column: 1 / -1; position: relative; overflow: hidden; isolation: isolate; padding: 8px; border-radius: var(--r); color: #fff;
           background: linear-gradient(150deg, #d9493b 0%, var(--red) 45%, var(--red-d) 100%);
           box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 22px 40px -22px rgba(120, 30, 20, .8); }
  .call::after { content: ""; position: absolute; z-index: -1; right: -30px; top: -40px; width: 150px; height: 150px; border-radius: 50%;
                  background: radial-gradient(closest-side, rgba(240, 180, 41, .55), rgba(240, 180, 41, 0)); }
  .call-label { margin: 8px 12px 4px; font-size: 12px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: rgba(255, 255, 255, .85); }
  .call a { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 10px 10px 10px 8px; border-radius: 18px; transition: background-color .2s; }
  .call a:focus-visible { outline-color: #fff; outline-offset: 0; }
  .bubble { display: grid; place-items: center; width: 54px; height: 54px; flex: none; border-radius: 17px; color: var(--ink); background: var(--gold);
             box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 10px 20px -10px rgba(90, 50, 0, .8); }
  .call-txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .t1 { font-size: 19px; font-weight: 900; line-height: 1.2; }
  .t2 { font-size: 17px; font-weight: 800; color: rgba(255, 255, 255, .92); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .call .go { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3); }
  @media (hover: hover) { .call a:hover { background: rgba(255, 255, 255, .08); } .call a:hover .go { background: var(--gold); color: var(--ink); transform: translate(2px, -2px); } }

  .act { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; min-height: 132px; padding: 14px; text-align: left; }
  .act-top { display: flex; align-items: flex-start; justify-content: space-between; width: 100%; }
  .act .chip { width: 48px; height: 48px; border-radius: 15px; background: var(--sand); color: var(--red-d); }
  .act .chip .i { width: 23px; height: 23px; }
  .act .go { width: 34px; height: 34px; }
  .act-label { display: block; margin-top: 14px; font-size: 16px; font-weight: 900; line-height: 1.25; }
  .act-sub { display: block; margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--muted); }

  .foot { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 22px 16px calc(26px + env(safe-area-inset-bottom)); font-size: 13px; font-weight: 700; color: var(--muted); }
